<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little surprise for Samyukdha 💞</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  font-family: Georgia, "Times New Roman", serif; color: #fff4fa;
  background: radial-gradient(circle at 50% 25%, #612044 0, #260d2b 42%, #100817 100%);
}
.card {
  width: min(100%, 390px); text-align: center; padding: 28px 22px;
  border: 1px solid rgba(255,174,218,.55); border-radius: 28px;
  background: rgba(36, 10, 36, .78);
  box-shadow: 0 0 28px rgba(255,70,164,.28), inset 0 0 24px rgba(255,120,190,.07);
}
.heart { font-size: 42px; filter: drop-shadow(0 0 12px #ff4ca4); }
h1 { font-size: 25px; margin: 8px 0 10px; font-weight: normal; }
p { color: #ffd4e9; line-height: 1.55; }
input {
  width: 100%; padding: 14px; margin: 12px 0; border-radius: 14px;
  border: 1px solid #e987bd; background: #1b0b20; color: white;
  text-align: center; font-size: 22px; letter-spacing: 8px;
}
button {
  width: 100%; border: 0; border-radius: 14px; padding: 14px;
  background: linear-gradient(90deg, #ff4c9a, #ff8bc4); color: #2b0920;
  font-size: 16px; font-weight: bold; cursor: pointer;
}
#error { min-height: 22px; color: #ffb2cf; font-family: Arial, sans-serif; font-size: 14px; }
#surprise { display: none; }
.photo {
  width: 100%; max-height: 62vh; object-fit: contain; border-radius: 18px;
  border: 1px solid rgba(255,174,218,.7); box-shadow: 0 0 22px rgba(255,70,164,.24);
  margin-top: 12px;
}
.message { font-size: 25px; line-height: 1.35; color: #fff0f7; text-shadow: 0 0 14px #ff4c9a; }
.small { font-size: 13px; opacity: .8; }
</style>
</head>

    <div class="heart">💗</div>
    <h1>A little surprise for you</h1>
    <p>Some things are meant just for you, Samyu ✨</p>

      <label for="pass">Enter our secret 4-digit code</label>
      <input id="pass" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Four digit password" required>
      <button type="submit">Unlock my surprise 💞</button>
      <div id="error" aria-live="polite"></div>
    </form>
    <p class="small">Made with love, just for you ♡</p>
